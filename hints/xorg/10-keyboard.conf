Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbModel" "pc105"
        Option "XkbLayout" "us,ru,gr"
        Option "XkbVariant" "winkeys"
        # /usr/share/X11/xkb/symbols/group
        # man xkeyboard-config
        Option "XkbOptions" "grp:rwin_toggle,grp:menu_toggle,grp:win_space_toggle,grp_led:scroll,terminate:ctrl_alt_bksp,compose:ralt"
EndSection
